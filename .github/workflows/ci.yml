name: CI
on:
  push:
    branches: [" *\]
 pull_request:
 branches: [\*\]
jobs:
 build:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v3
 - name: Setup Node
 uses: actions/setup-node@v3
 with:
 node-version: '18'
 - name: Install dependencies
 run: npm ci
 - name: Run lint
 run: npm run lint
 - name: Build
 run: npm run build
 - name: Test
 run: npm test
